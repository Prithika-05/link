version: "3.9"

services:

  nginx:
    image: nginx:1.28-alpine
    container_name: secure-chat-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    networks:
      - backend

  api1:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ./backend/.env

    restart: unless-stopped

    expose:
      - "3000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp

    networks:
      - backend

  api2:
    extends:
      service: api1

  api3:
    extends:
      service: api1

  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    env_file:
      - ./backend/.env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

  redis:
    image: redis:8-alpine

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - yes

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

volumes:
  postgres_data:

  redis_data:

networks:
  backend:
    driver: bridge