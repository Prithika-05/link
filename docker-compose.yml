services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: link_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-link_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-link_password}
      POSTGRES_DB: ${POSTGRES_DB:-link_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-link_admin} -d ${POSTGRES_DB:-link_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis Cache & Pub/Sub
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: link_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Node.js Backend API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: link_backend
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-link_admin}:${POSTGRES_PASSWORD:-link_password}@postgres:5432/${POSTGRES_DB:-link_db}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  # ==========================================
  # React Frontend (Build Container)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: link_frontend_builder
    volumes:
      - frontend_dist:/app/dist-volume

  # ==========================================
  # Nginx Reverse Proxy & Static File Server
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: link_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  frontend_dist:
