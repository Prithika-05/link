events {
    worker_connections 2048; 
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance Optimizations
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 100;
    server_tokens      off; 

    # -------------------------------------------------------------------------
    # AWS ALB IP Restoration Setup
    # -------------------------------------------------------------------------
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # REFINEMENT 1: Narrowed CIDR trust boundaries. 
    # Replaced 10.0.0.0/8 with standard AWS VPC default subnet block to prevent internal IP spoofing.
    set_real_ip_from 172.31.0.0/16;
    set_real_ip_from 127.0.0.1;

    # -------------------------------------------------------------------------
    # Production Rate Limiting Zones (Coarse Traffic Flood Protection)
    # -------------------------------------------------------------------------
    # REFINEMENT 2: Coordinated limits. Raised Nginx thresholds to absorb massive 
    # brute-force floods at the edge, allowing Fastify to handle fine-grained user rate limiting.
    limit_req_zone $realip_remote_addr zone=api_limit_zone:20m rate=15r/s;
    limit_req_zone $realip_remote_addr zone=ws_limit_zone:20m rate=5r/s;

    upstream backend_nodes {
        server backend:3000;
        keepalive 32; 
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml;
        gzip_min_length 1000;

        # -------------------------------------------------------------------------
        # REFINEMENT 3: Fixed Conflicting SPA Cache Headers
        # -------------------------------------------------------------------------
        # Root index.html entry point: MUST NOT be cached so users always pull the newest app version.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # Static assets (Hashed JS, CSS, Media): Can be cached permanently because a change generates a new filename.
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # -------------------------------------------------------------------------
        # REST API Endpoints Proxying
        # -------------------------------------------------------------------------
        location /api/ {
            # Allows high bursts to accommodate clean frontend SPA page loads before hitting backend-level limits.
            limit_req zone=api_limit_zone burst=30 nodelay;

            proxy_pass http://backend_nodes/;
            proxy_http_version 1.1;
            
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            
            proxy_set_header X-Real-IP $realip_remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # -------------------------------------------------------------------------
        # Socket.io / WebSockets Proxying
        # -------------------------------------------------------------------------
        location /socket.io/ {
            limit_req zone=ws_limit_zone burst=10 nodelay;

            proxy_pass http://backend_nodes/socket.io/;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $realip_remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
